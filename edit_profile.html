{% extends "base.html" %}
{% block content %}
<section class="auth">
  <h1>Edit profile</h1>
  <form method="post">
    <label>Display name <input name="display_name" maxlength="60" value="{{ g.user.display_name }}" required></label>
    <label>Bio <textarea name="bio" maxlength="300" rows="3">{{ g.user.bio }}</textarea></label>
    <label>Avatar image URL <input type="url" name="avatar_url" maxlength="255" value="{{ g.user.avatar_url }}"></label>
    <button class="btn wide">Save changes</button>
  </form>
</section>
{% endblock %}
